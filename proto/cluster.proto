syntax = "proto3";
package cluster;
option go_package = "distapi/gen/cluster";

// Runs on MASTER, called by NODE
service Coordinator {
  rpc Register(RegisterRequest)       returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest)     returns (HeartbeatResponse);
  rpc Deregister(DeregisterRequest)   returns (DeregisterResponse);
}

message DeregisterRequest {
  string node_id    = 1;
  string session_id = 2;
  string reason     = 3; // alasan keluar: "shutdown", "user", dll
}

message DeregisterResponse {
  bool   accepted = 1;
  string message  = 2;
}

// Runs on every NODE (and master's local worker), called by MASTER
service Worker {
  rpc ProcessImage(ProcessRequest) returns (ProcessResponse);
}

message RegisterRequest {
  string node_id        = 1;
  string session_id     = 2; // random per-start; distinguishes restarts
  string advertise_addr = 3; // IP:port reachable by master
  int32  capacity       = 4; // max concurrent tasks
}

message RegisterResponse {
  bool   accepted = 1;
  string message  = 2;
}

message HeartbeatRequest {
  string node_id      = 1;
  string session_id   = 2;
  int32  active_tasks = 3;
}

message HeartbeatResponse {
  bool ok = 1;
}

message ProcessRequest {
  string task_id       = 1;
  string job_id        = 2;
  int32  image_index   = 3;
  bytes  image_data    = 4;
  string filename      = 5;
  int32  resize_width  = 6; // 0 = keep original
  int32  resize_height = 7; // 0 = keep original
  bool   grayscale     = 8;
}

message ProcessResponse {
  string task_id     = 1;
  bool   success     = 2;
  bytes  result_data = 3;
  string filename    = 4;
  string error       = 5;
  int64  duration_ms = 6;
}
